<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
        // Decap CMS has no official "logout" event, so catch the click on the
        // "Log out" menu item itself and send the browser back to the site.
        document.addEventListener('click', function (e) {
            var el = e.target.closest('button, a, [role="button"], li');
            if (el && /log\s*out/i.test(el.textContent || '')) {
                setTimeout(function () {
                    window.location.href = '/';
                }, 100);
            }
        }, true);
    </script>
</body>

</html>
